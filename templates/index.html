<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Podcast to Reel Pipeline</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2em; }
        .container { max-width: 600px; margin: auto; }
        label { display: block; margin-top: 1em; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 0.5em; }
        button { margin-top: 2em; padding: 0.7em 2em; font-size: 1em; }
    </style>
</head>
<body>
<div class="container">
    <h2>Podcast to Reel Pipeline</h2>
    <form id="main-form" action="/start" method="post">
        <label for="youtube_url">YouTube URL:</label>
        <input type="text" id="youtube_url" name="youtube_url" placeholder="https://youtube.com/..." required>

        <label for="whisper_model">Whisper Model:</label>
        <select id="whisper_model" name="whisper_model">
            <option value="tiny">tiny</option>
            <option value="base" selected>base</option>
            <option value="small">small</option>
        </select>

        <label for="min_length">Min Clip Length (seconds):</label>
        <input type="number" id="min_length" name="min_length" value="30" min="10" max="300">

        <label for="max_length">Max Clip Length (seconds):</label>
        <input type="number" id="max_length" name="max_length" value="60" min="10" max="600">

        <button type="submit">Start</button>
    </form>
    <div id="loading" style="display:none; text-align:center; margin-top:2em;">
        <div style="font-size:1.2em;">Processing... Please wait.</div>
        <div style="margin-top:1em;">
            <svg width="50" height="50" viewBox="0 0 50 50">
                <circle cx="25" cy="25" r="20" stroke="#007bff" stroke-width="5" fill="none" stroke-linecap="round">
                    <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s" repeatCount="indefinite"/>
                </circle>
            </svg>
        </div>
    </div>
    <script>
        document.getElementById('main-form').addEventListener('submit', function() {
            document.getElementById('main-form').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
        });
    </script>
</div>
</body>
</html>
