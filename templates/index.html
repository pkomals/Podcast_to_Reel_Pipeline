<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Podcast to Reel Pipeline</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <h2 class="mb-4 text-center">Podcast to Reel Pipeline</h2>
    <form id="main-form" action="/start" method="post" class="needs-validation" novalidate>
        <div class="mb-3">
            <label for="youtube_url" class="form-label">YouTube URL:</label>
            <input type="text" id="youtube_url" name="youtube_url" class="form-control" placeholder="https://youtube.com/..." required>
        </div>
        <div class="mb-3">
            <label for="whisper_model" class="form-label">Whisper Model:</label>
            <select id="whisper_model" name="whisper_model" class="form-select">
                <option value="tiny">tiny</option>
                <option value="base" selected>base</option>
                <option value="small">small</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="min_length" class="form-label">Min Clip Length (seconds):</label>
            <input type="number" id="min_length" name="min_length" class="form-control" value="30" min="10" max="300">
        </div>
        <div class="mb-3">
            <label for="max_length" class="form-label">Max Clip Length (seconds):</label>
            <input type="number" id="max_length" name="max_length" class="form-control" value="60" min="10" max="600">
        </div>
        <button type="submit" class="btn btn-primary w-100">Start</button>
    </form>
    <div id="loading" class="text-center mt-5" style="display:none;">
        <div class="fs-5">Processing... Please wait.</div>
        <div class="mt-3">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('main-form').addEventListener('submit', function() {
            document.getElementById('main-form').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
        });
    </script>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
